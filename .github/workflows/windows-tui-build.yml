name: windows-tui-build

# Build the Windows opencode CLI (TUI) remotely on demand. Nothing is built
# locally; the resulting exe is uploaded as an artifact.
# Trigger manually: Actions -> windows-tui-build -> Run workflow -> pick variant.
#
# Builds on a Linux runner: bun cross-compiles the Windows exe
# (--target=opencode-windows-*), exactly like upstream's publish workflow.
# A Windows runner does NOT work here: bun's Windows `--linker hoisted`
# install (setup-bun workaround for patched peers) results in
# @opentui/solid's nested @babel/core being installed without its deps
# -> "Cannot find module '@babel/helper-compilation-targets'".

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Windows build target"
        required: false
        type: choice
        default: x64
        options:
          - x64
          - arm64
          - x64-baseline

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: "1.4.2"

      - name: Resolve CLI version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Typecheck touched packages (best effort, non-blocking)
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          bun run --cwd packages/core typecheck
          bun run --cwd packages/cli typecheck

      - name: Build Windows CLI
        shell: bash
        run: bun run --cwd packages/cli script/build.ts --target=opencode-windows-${{ inputs.variant }}
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_CHANNEL: dev
          GH_TOKEN: ${{ github.token }}
          BUN_COMPILE_RELEASE: bun-v1.4.2

      - name: Upload Windows TUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cli-windows-${{ inputs.variant }}
          # build.ts writes to dist/cli-<target>/bin/opencode(.exe); upload the
          # whole dir (mirrors upstream's `packages/cli/dist/cli-*` upload).
          path: packages/cli/dist/cli-windows-${{ inputs.variant }}
          if-no-files-found: error